# resume_db.example.yaml
#
# Your career, in the form this tool needs. Copy to resume_db.yaml and replace
# everything. resume_db.yaml is gitignored — it is yours and never committed.
#
# Generate a first draft with:   .venv/bin/python run.py bootstrap --resume your_resume.docx
# Bootstrap fills `id`, `text` and a rough `tags`. The rest is hand-written, and
# the rest is where the quality comes from.

sections:
  # One entry per heading in your résumé .docx.
  - name: ACME CORP.

    # MUST match the heading paragraph in your .docx character for character —
    # same spelling, same punctuation, same capitalisation. The renderer finds
    # the section by string match; a mismatch is a hard error, not a warning.
    header_text: ACME CORP.

    bullets:
      - # ---------------------------------------------------------------
        # REQUIRED: id, text, tags
        # ---------------------------------------------------------------

        # Stable, unique, lowercase-with-hyphens. Referenced by base_resume.yaml,
        # by --keep on the command line, and by `superseded_by`. Do not renumber
        # these once they exist; other files point at them.
        id: acme-billing-migration

        # The finished résumé sentence. THIS IS THE ONLY FIELD THAT REACHES THE
        # DOCUMENT. Write it the way you want it printed.
        #
        # House style that the validators enforce — writing against it means your
        # edits get rejected and the original is kept:
        #   - no em dash (—) and no double hyphen (--)
        #   - roughly 210–250 characters is normal; over 260 warns
        #   - lead with a verb, then What → Why → How → Impact
        #   - do not reuse the same lead verb across bullets in one section
        text: >-
          Migrated billing from a monthly to a weekly cycle for 12,000 merchants,
          after churn interviews showed payout speed was the top reason for leaving,
          by modelling the working-capital impact and rebuilding settlement to carry
          corrections forward, cutting merchant churn 18%.

        # Free vocabulary. Matched against the job description to decide which
        # bullets are relevant, so use the words a posting would use, not internal
        # jargon. Ten to fifteen is a reasonable number.
        tags:
          org: ACME CORP.
          keywords: [billing, settlement, churn, financial modelling, payments, SQL]
          content_type: [quantitative-impact, cross-functional, product-build]

        # ---------------------------------------------------------------
        # STRONGLY RECOMMENDED: context
        # ---------------------------------------------------------------
        # Background the model may draw on when rewording this bullet.
        #
        # It is also the ALLOWED-NUMBERS SOURCE. Any figure that appears in a
        # rewritten sentence but is not present in `text` or `context` is treated
        # as invented and the rewrite is discarded. So: every number you might
        # ever want to surface must be written down here, even if the current
        # sentence does not use it.
        context:
          why: >-
            Competitors had already moved to weekly settlement. Exit interviews put
            payout speed first among reasons merchants left, ahead of fees.
          how: >-
            Ran cash-flow simulations to size the working-capital impact of the
            shorter cycle, then worked with engineering on adjustment logic so a
            refund landing after payout is netted into the next run rather than
            clawed back from the merchant's balance.
          impact: >-
            Churn fell 18% in the two quarters after launch. Support volume on
            payout questions fell by about a third. 12,000 merchants on the new
            cycle at launch, 15,400 within six months.

        # ---------------------------------------------------------------
        # OPTIONAL
        # ---------------------------------------------------------------

        # Human-readable date range. Never rendered into the document — it is for
        # you, for interviews, and for keeping the timeline straight when you have
        # forty of these.
        period: "2023-04 – 2023-11"

      - id: acme-support-routing
        text: >-
          Rebuilt customer support routing around fault attribution rather than
          inquiry wording, after a transaction surge made headcount the default
          answer, by interviewing agents to build a taxonomy and reaching into
          settlement for partial-order cases, automating 18% of monthly volume.
        tags:
          org: ACME CORP.
          keywords: [customer support, automation, taxonomy, process design]
          content_type: [quantitative-impact, cross-functional]
        context:
          why: >-
            Inquiries grew faster than the team. The outsourcing partner proposed
            more agents, which ties support cost to demand permanently.
          how: >-
            Interviewed our own agents and the outsourced ones to find root causes,
            built a branching taxonomy by who was at fault, then extended settlement
            so a claim could cover part of an order — the case that had no software
            path at all.
          impact: >-
            4,000 of roughly 22,000 monthly inquiries auto-resolved. Automation rate
            0 to 18%. Average handling time 5 minutes to 4. Led a team of four.
        period: "2022-01 – 2022-10"

  - name: ADDITIONAL
    header_text: ADDITIONAL

    bullets:
      - id: add-mentoring

        # `label` forces a bold "Label: " prefix on the rendered line. Used for
        # ADDITIONAL-style sections where each line names its own category.
        label: Mentoring

        text: >-
          Advised 30+ early-stage founders on product strategy as a university
          startup-centre mentor.
        tags:
          org: ADDITIONAL
          keywords: [mentoring, product strategy, early-stage]
          content_type: [leadership]

      - id: add-sensitive-example

        # `interview_only: true` means: never print this, but keep it where you
        # can find it. Use it for anything you would say out loud but cannot
        # evidence in writing — unverified internal figures, confidential
        # specifics, claims you would not want a recruiter to quote back.
        #
        # The renderer skips these entirely.
        interview_only: true

        text: >-
          Something true that you are willing to say in a room but not to publish.
        tags:
          org: ADDITIONAL
          keywords: []
          content_type: []

      # Two more flags you will eventually want:
      #
      #   retired: true
      #     Permanently out. Blocked in three separate places so it cannot come
      #     back through any path. Prefer this over deleting an entry, so the
      #     record of why survives.
      #
      #   superseded_by: some-other-id
      #     This bullet was replaced by another. Keeps the history readable.
      #
      #   pinned: true
      #     Never swapped out, whatever the job description says.
