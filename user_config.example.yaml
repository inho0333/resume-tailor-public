# user_config.example.yaml
#
# Paths and settings. Copy to user_config.yaml and edit.
#
#     cp user_config.example.yaml user_config.yaml
#
# user_config.yaml is gitignored. `python run.py setup` writes a first version of
# it and patches only the keys it owns on a re-run, comments intact; after that
# you edit it by hand.
#
# Facts about *you* (degree, graduation, work authorisation, target roles) are
# not here — they are in profile.yaml. This file is only about files, modes and
# which model does the work.
#
# Check your work with:  python run.py doctor

# ── your résumé ─────────────────────────────────────────────────────────────

# The one-page .docx everything is rendered from. Its fonts, margins and bullet
# formatting ARE the output's formatting, so use the file you actually send out.
# No default: a wrong path here is how you would mail someone else's résumé.
resume_path: /Users/you/Documents/Your_Resume.docx

# How a posting is tailored.
#
#   minimal  — start from the résumé you already approved, swap wording to the
#              posting's vocabulary, and replace one or two bullets. Sentences
#              are never rewritten. This is the mode worth using, and the
#              default. It requires base_resume.yaml (below).
#   rebuild  — re-pick every bullet from resume_db.yaml and rewrite them all.
#              The older path, kept for comparison. It produces telegraphic
#              sentences under the character budget, which is why it is not the
#              default. Use it only before you have written base_resume.yaml.
tailor_mode: minimal

# The .docx that minimal mode edits — normally the same file as resume_path.
# Required in minimal mode, with no default on purpose.
base_resume_path: /Users/you/Documents/Your_Resume.docx

# Optional. Finished drafts are also copied here, one subfolder per company — a
# cloud-drive folder, say, so they show up on your phone. A path that is not
# mounted is skipped quietly and never blocks a run. Omit to disable.
# sync_dir: /Users/you/Library/CloudStorage/.../Resumes

# ── how many bullets a section may show ─────────────────────────────────────
#
# Per section heading, exactly as it appears in your .docx. `bootstrap` fills
# this with the counts it parsed out of your own résumé, because those counts
# are what made it fit on one page. Raising a number here is the quickest way
# to spill onto page two.
max_bullets_per_section:
  ACME CORP.: 4
  EXAMPLE VENTURES: 3
  ADDITIONAL: 3

# ── lines no edit may touch ─────────────────────────────────────────────────
#
# A labelled line like "Skills:" has a settled order and composition, and
# shortening it is the easiest way for a model to win back a line. Lines
# starting with any of these prefixes are excluded from editing, from bullet
# swaps and from automatic shortening.
#
# The default is ["Skills:", "Languages:"], which was hardcoded until it became
# a setting — so a résumé whose line reads "Technical Skills:", "SKILLS:" or
# "Tools:" had no protection at all and was reworded freely. `run.py setup`
# fills this in from the labelled lines it finds in your own document, and
# `doctor` warns about any it does not cover.
protected_prefixes:
  - "Skills:"
  - "Languages:"

# ── which model does the work ───────────────────────────────────────────────
#
# Two roles (see llm_client.py):
#   light — classification and extraction. Runs often, tolerates a small model.
#   heavy — writing and judging the sentences on your résumé. A few calls per
#           posting, and the whole quality of the output.
#
# Values: auto | ollama | claude-cli | claude-api | codex-cli | <your own>
#
#   auto        light: a local model if you have one, else a CLI, else the API.
#               heavy: a frontier model, falling back to local only as a last
#               resort — and it tells you when it does.
#   ollama      free and local, needs `ollama serve` + a pulled model. Good for
#               light work. Noticeably weaker at writing bullets.
#   claude-cli  `claude -p` on the logged-in Claude Code CLI (billed to the
#               subscription; the rate limit is shared with your own
#               interactive Claude Code sessions).
#   claude-api  Anthropic API with ANTHROPIC_API_KEY in your environment.
#               Metered per token.
#   codex-cli   OpenAI Codex, or any other agent CLI you define below.
#
# A reasonable split on a laptop with no local model: leave both on auto, which
# resolves to whichever CLI you have. On a desktop that is always on, Ollama for
# light work costs nothing.
light_backend: auto
heavy_backend: auto

# Extra CLI backends, as argv. `codex-cli` and `gemini-cli` have built-in
# defaults (see config.py); anything here overrides them, and a new key adds a
# backend you can pass to --backend.
#
#   prompt_via: stdin  — the prompt is piped in (most agent CLIs)
#   prompt_via: arg    — the prompt is appended as the last argument
#   strip_prefix_lines — drop N banner lines the CLI prints before the answer
#
# Verify yours with:  python run.py doctor --probe --backend codex-cli
# backends:
#   codex-cli:
#     command: [codex, exec, --skip-git-repo-check, "-"]
#     prompt_via: stdin
#   my-wrapper:
#     command: [/Users/you/bin/ask-model]
#     prompt_via: stdin

# A heavy rewrite genuinely takes minutes. Lower this and you cancel work that
# was about to succeed.
cli_timeout_seconds: 1200

# ── where postings are found ────────────────────────────────────────────────
#
# `run.py watch` polls these. Leave it out entirely and postings arrive the way
# they always did, through `run.py tailor --url` or `--jd-file`.
#
# Which source suits you depends on whether you are searching broadly or already
# know the employers you care about. tracker/CHANNELS.md covers each one: what
# it costs to set up, what it can see, and what it cannot.
#
# tracker:
#   sources: [greenhouse, remotive]
#
#   # Companies you name, from their own board. No account, and the posting body
#   # comes with the listing. The identifier is in their careers-page URL.
#   greenhouse:
#     companies:
#       - {name: Epic Games, board_token: epicgames}     # boards.greenhouse.io/<token>
#   lever:
#     companies:
#       - {name: Palantir, client_name: palantir}        # jobs.lever.co/<client_name>
#   ashby:
#     companies:
#       - {name: Ramp, org: ramp}                        # jobs.ashbyhq.com/<org>
#
#   # The only source with an exclude list: one Apple team posts hundreds of
#   # unrelated roles, so "business but not hardware" is the useful filter.
#   apple:
#     teams: [internships-STDNT-INTRN]
#     location: united-states-USA
#     include_keywords: [Business, Strategy, Operations]
#     exclude_keywords: [Hardware, Software, PhD]
#
#   # An aggregator. Needs a free account, and its COVERAGE IS SET ON THEIR SITE:
#   # the values here only narrow what your saved preferences already allow.
#   trackly:
#     limit: 50
#     functions: [product, strategy]
#
#   # Remote roles, no account at all — the source that works the minute you
#   # install this.
#   remotive:
#     category: Product Management
#     limit: 50
#
#   # One short judgment per posting, on the light backend, before anything is
#   # queued: is this even the same kind of work? A source's own filters are
#   # coarse (an "operations" tag covers supply-chain scheduling and product
#   # operations equally), and the alternative is a digest with fifty questions
#   # in it. It fails open — every failure lets the posting through — so turning
#   # it off only means more postings reach you, never fewer.
#   relevance_filter: true
#
#   # Titles and companies you never want to see again. The one fail-closed step
#   # in the tracker, so it starts empty and stays yours: one person's noise is
#   # another's target. Lowercase substring match; a match is dropped silently.
#   block_titles: []
#   block_companies: []

# ── how you are asked to approve a posting ──────────────────────────────────
#
# Channel names from channels/, in the order to try them. ["auto"] — the
# default — means the local inbox plus every channel whose credentials happen to
# be in the environment, so an existing Telegram setup keeps working with
# nothing set here.
#
#   telegram — inline ✅/⏭️ buttons, answered in the chat. The only one that can
#              answer its own messages. TG_BOT_TOKEN + TG_CHAT_ID.
#   discord  — a webhook URL and nothing else, so it is the quickest to set up.
#              No buttons: you answer with `run.py pending --make <id>`.
#   email    — your own SMTP credentials. No app on the phone, no buttons.
#   local    — the default. state/inbox.md plus `run.py inbox`. No credentials.
#   whatsapp — interface only; see channels/whatsapp.py for why.
#
# No channel is required. With none configured the whole pipeline still runs and
# the queue is read with `run.py inbox`.
notify_channels: [auto]

# Generation budget when a LOCAL model does the work, as native Ollama options.
# A reasoning model (gpt-oss and friends) spends its budget on thinking before it
# answers, and with too small a budget it returns an empty answer rather than an
# error — the step is simply lost. Measured on a realistic posting with the
# client's older default: 9,297 characters of thinking and nothing in the answer.
#
# Raise num_ctx further if your model supports it; lower it if the machine runs
# out of memory (the symptom is Ollama killing the request).
# ollama_light_options: {num_ctx: 16384, num_predict: 4096}
# ollama_heavy_options: {num_ctx: 32768, num_predict: 8192}

# ── the approval gate ───────────────────────────────────────────────────────
#
# Only relevant when postings arrive automatically (`run.py watch`, or an
# upstream watcher). Running `tailor` yourself ignores all of it.

# Process a handed-over posting end to end without a human. False means you get
# a notification and run `tailor` yourself.
auto_draft: true

# Drop an approval request nobody answered after this many days. Each one holds
# a whole job posting, and a three-week-old posting has usually closed.
confirm_ttl_days: 7

# Batch approval requests instead of sending one message per posting. These are
# local-time hours; an empty list sends each one immediately (which is how you
# end up with fifteen messages in a day and stop reading them).
digest_hours: [9, 20]
digest_max_items: 10

# Postings judged below this fit tier are not offered an approve/skip pair, just
# a single "draft it anyway" button. One of: high, mid, low.
prefit_ask_min_tier: mid

# ── quality gates ───────────────────────────────────────────────────────────

# Score each draft the way a recruiter would, and put the objections in the
# report.
recruiter_review: true

# Let that step REWRITE sentences too. Off by default in minimal mode: this is
# the step that produced unreadable compressions like "held to ~20%/~5% vs
# 60-70% claims". The score and the objections still reach you; the wording
# stays yours.
recruiter_polish: false

# Flag the report when the recruiter score is below this (out of 10).
recruiter_score_warn: 7
