# base_resume.sample.yaml — the approved-résumé subset of resume_db.sample.yaml.
#
# Fictional, and for the test suite only. It plays the part a real base_resume.yaml
# plays: the sentences already approved by hand, which "minimal" mode treats as the
# quality floor and makes the smallest possible edits to.
#
# Two rules, both of them hard errors in the real file and both held here:
#   1. every `id` exists in resume_db.sample.yaml
#   2. every `text` is identical, character for character, to that bullet's `text`
#      there (tests/test_minimal_tailor.py pins both)
#
# The character total is what gives minimal mode its one-page guarantee, so it is
# sized like a real one-page résumé; test_base_fits_one_page_budget pins the range.

# The document these sentences were taken from. No test reads it: the one test that
# needs a .docx builds one from this file at run time, so that a fresh clone needs no
# binary fixture.
source_docx: /path/to/Sample_Resume.docx

sections:
  - name: ACME CORP.
    header_text: ACME CORP.
    bullets:
      - id: acme-investment
        text: >-
          Invested $12.4M across 28 startups after building a bottom-up demand model, when three
          failed deals showed founder projections went unchallenged, pricing each round on
          evidence of willingness to pay rather than claimed market size, at a 33% follow-on rate.

      - id: acme-deck-tool
        text: >-
          Built an internal deck-scoring service to keep pace with a deal pipeline that had
          tripled, when partners were still reading every inbound deck by hand, completing
          database and API integration hands-on, saving the team 30 hours a month.

      - id: acme-batch-program
        text: >-
          Launched a cohort programme for 24 portfolio teams after founders said the firm's
          support ended at the wire transfer, designing the curriculum around the three questions
          every seed round is asked, drawing 500 applications for 24 places.

      - id: acme-portfolio-reporting
        text: >-
          Standardised quarterly portfolio reporting across 28 companies after the investor update
          took three weeks of manual collation, writing one template fund-wide and a shared metric
          dictionary, cutting the cycle to four days.

  - name: EXAMPLE CO.
    header_text: EXAMPLE CO.
    bullets:
      - id: example-review-ui
        text: >-
          Redesigned the review submission flow after session recordings showed shoppers
          abandoning at a photo upload most of them did not need, moving verification to the end
          of the flow, lifting completed reviews 22% with no fall in review quality.

      - id: example-claim2
        text: >-
          Rebuilt claims routing around who caused the fault rather than how a shopper worded the
          request, after a demand surge made hiring more agents the default answer, extending
          settlement to cover partial orders, automating 4,000 tickets a month, 18% of inbound
          volume.

      - id: example-kpi
        text: >-
          Established a SQL-based KPI framework through a 10x volume surge and presented it
          company-wide each month, after cohort analysis showed novelty goods grew volume but
          rarely repeated, shifting sourcing to hold repurchase above 30%.

      - id: example-pricing
        text: >-
          Repriced the 200 highest-volume listings after margin analysis found discounts going to
          items that were already converting, replacing blanket promotions with a rule keyed to
          inventory age, recovering 4 points of contribution margin.

  - name: ADDITIONAL
    header_text: ADDITIONAL
    bullets:
      - id: add-skills
        text: >-
          Skills: Product Analytics (SQL, Python) | Financial Modelling (Excel) | Languages:
          English (fluent), Spanish (conversational)

      - id: add-mentoring
        text: >-
          Advised 30 early-stage founders on pricing and go-to-market as a mentor at a university
          startup centre.

      - id: add-product-building
        text: >-
          Shipped a scheduling tool used by 2,000 people a month, written alone, to learn the
          parts of building a product a manager never touches.
