# profile.example.yaml
#
# Who you are, and what you are looking for.
#
# The wizard writes this file for you and asks only the questions your answers
# make relevant:
#
#     python run.py setup
#
# Copy it by hand instead if you prefer:
#
#     cp profile.example.yaml profile.yaml
#
# profile.yaml is gitignored. Nothing in it is ever committed, and nothing in it
# is sent anywhere except into the prompts this tool builds on your machine.
#
# WHY THIS FILE EXISTS
# Every judgment the tool makes is about a person: is this posting open to you,
# does its work-authorisation language rule you out, is it in a place you would
# take, is this the kind of role you would actually accept, do the rewritten
# sentences sound like yours. These values used to be hardcoded in fit_gate.py
# and jd_extractor.py. Fill this in and the prompts describe you; leave a field
# empty and the prompts stop reasoning about it at all, which is the safe
# default — not a filter that quietly guesses.
#
# Check your work with:  python run.py doctor

# Your name as it appears on the résumé. Used in output filenames and reports.
# Not sent to any service.
name: Jane Doe

# ── WHO YOU ARE ────────────────────────────────────────────────────────────────
background:
  # Which of these you are decides how every prompt introduces you, which fields
  # below matter, and who the recruiter persona compares you against:
  #
  #   enrolled_student — studying now, applying for an internship or a first role
  #   recent_graduate  — finished, little or no full-time history yet
  #   experienced      — years of relevant work; the pile you are compared with
  #                      is other experienced hires, not students
  #   career_changer   — years of work, but in a different field from the target
  kind: enrolled_student

  # Years of relevant professional experience. Leave empty for a student.
  #
  # This is one half of the years-of-experience check: a posting that states
  # "8+ years required" against a profile saying 3 is reported as a hard
  # mismatch rather than quietly tiered "possible fit". Leave it empty and that
  # check does not run.
  years_experience:

  # One or two sentences on your career, in the third person. This is the only
  # place the fit judgment learns what you have actually done, so write it the
  # way you would say it out loud, not as a list of titles.
  #
  #   "Product management at a consumer marketplace (payments, fraud), then
  #    early-stage VC investing in Southeast Asia."
  summary: >-
    Product management at a mid-size fintech, then early-stage venture investing.

  # Past employers, as the résumé spells them. Used for relevance matching.
  employers:
    - Acme Corp
    - Example Ventures

  education:
    # The institution's name as a recruiter would recognise it. Leave empty if
    # you have no degree you want considered — nothing below it will be claimed.
    school: Example University

    # The degree, written the way postings write it: "MBA", "MS Computer
    # Science", "MPP". This string goes into the eligibility prompt verbatim, so
    # "MBA" matches a posting that says "MBA candidates" and "Master's in
    # Business" does not.
    program: MBA

    # YYYY-MM. Postings gate on class year ("graduating in 2027", "rising
    # second-year"), and this is what the tool compares against. Getting it
    # wrong by a year silently mis-screens every posting, so check it once here
    # rather than wondering later why good postings were tiered low.
    graduation: 2027-05

    # Have you finished it? false while enrolled.
    completed: false

    # Is it a technical/engineering degree? This flips how the eligibility
    # screen reads "requires a technical degree":
    #   false -> such a posting is reported as not a literal match (MBA, MPP, MA…)
    #   true  -> such a posting is fine (MS CS, MS EE, PhD in engineering…)
    is_technical: false

# ── WHAT YOU ARE LOOKING FOR ───────────────────────────────────────────────────
#
# Every field here is optional, and empty has a precise meaning: the tool does
# not reason about that axis. It is never a hidden filter. The axes that are
# filled are checked in code rather than by a model — a location mismatch is
# arithmetic, not judgment — and each mismatch is reported to you by name.
search:
  # internship | new_grad | full_time | contract
  #
  # State it. The first version of this tool inferred it from the word "intern"
  # appearing in a target role, which made "internal audit" an internship
  # search. Leave it empty and employment type is not screened at all.
  kind: internship

  # Which term you are applying for, if it matters ("Summer 2027"). Shown to the
  # model so it does not offer you a posting for the wrong year. Internship
  # searches only.
  term: Summer 2027

  # The roles you actually want. These do real work: a posting whose title
  # matches one of these can never be tiered "weak fit" (missing a good posting
  # costs more than one noisy notification), and "strong fit" needs the model
  # and your own targets to agree.
  #
  # Write them as they appear in job titles, lowercase, one concept each. Short
  # fragments match more titles: "product manage" catches "Product Management
  # Intern" and "Product Manager, Payments".
  #
  # `doctor` FAILS if you leave this list at the example's values. It is not a
  # cosmetic default: left alone, it applies a stranger's job search to every
  # posting you see.
  target_roles:
    - product manage
    - product owner
    - corporate strategy
    - corporate development
    - business development

  # Roles you keep declining. A posting matching these is capped at "possible
  # fit" and sinks to the bottom of the digest, but is still shown — the tool
  # never hides a posting from you outright.
  #
  # Leave empty on day one. Fill it in after a week of real notifications, when
  # you know what you keep skipping; `python run.py decisions` prints that
  # history.
  avoid_roles: []

  # Levels you want, lowercase, as postings title them: [senior, staff,
  # principal]. Empty means any level. Used together with years_experience to
  # flag a posting pitched far above or below you.
  seniority: []

  # Places you would take a job, as a person would write them ("San Francisco
  # Bay Area", "London", "Remote (US)"). Empty means anywhere, and no posting is
  # ever filtered on location.
  locations: []

  # remote | hybrid | onsite — which of these you would accept. Empty means all
  # three.
  work_arrangement: []

  # Would you move for a role outside the locations above? When false, a posting
  # elsewhere is reported as a location mismatch; when true, it is not.
  relocate: false

  # The least you would accept, when a posting states its range. Empty means
  # compensation is never considered — which is the right setting for most
  # internship searches, since those postings rarely state one.
  #
  #   comp_floor: {amount: 180000, currency: USD, period: year}
  comp_floor:

  # Conditions you will not take, in your own words ("shift work", "field
  # operations", "five days on site", "on-call rotation").
  #
  # These replace a list that used to be hardcoded into the fit prompt, which
  # meant everyone inherited one person's taste — including people who were
  # looking for exactly the operations roles it quietly down-ranked.
  dealbreakers: []

# ── WHERE YOU ARE LOOKING ──────────────────────────────────────────────────────
market:
  # Two-letter country code for the job market you are searching: US, GB, DE,
  # CA, SG…
  #
  # It adds that country's own immigration wording to the sponsorship scan (an
  # employer in the UK writes "we cannot offer a Certificate of Sponsorship",
  # not "H-1B"), sets the locale company news is read in, and marks that
  # country's city names as noise rather than keywords.
  #
  # Leaving it empty costs you only the country-specific phrasings: the
  # country-neutral scan ("we do not sponsor", "no visa sponsorship") always
  # runs, because a posting whose real disqualifier is that sentence is too
  # expensive to miss.
  country: US

# ── YOUR RIGHT TO WORK ─────────────────────────────────────────────────────────
authorization:
  # Your authorisation to work, in one sentence, in the terms a recruiter uses.
  # Read by the screen that decides whether a posting's immigration language
  # rules you out.
  #
  # Examples:
  #   "Citizen"
  #   "Permanent resident, no sponsorship needed"
  #   "Student visa; internships via work authorisation my school approves"
  #   "Requires employer sponsorship for full-time work"
  #
  # LEAVE IT EMPTY ("") if you would rather the prompts never reason about your
  # status. The sponsorship check that still runs is a regex over the posting
  # text, not a model judgment, so an empty value simply means no filtering.
  statement: ""

  # Do explicit citizenship requirements rule you out? Set true if "citizens
  # only", an export-control residency status or a security clearance is a hard
  # stop for you; such postings are then flagged. Set false if they are
  # irrelevant to you. Ignored when `statement` is empty.
  citizenship_requirements_block: true

  # Will you need sponsorship for full-time work later? If true, a posting that
  # says "without the need for current OR FUTURE sponsorship" is flagged even
  # when the role itself would be fine — that wording is a first-round filter at
  # employers who use an internship as a hiring pipeline.
  sponsorship_needed_later: false

# ── HOW YOUR SENTENCES READ ────────────────────────────────────────────────────
voice:
  # Two or three of your own strongest bullets, verbatim from your résumé.
  #
  # WHAT THEY ARE FOR: the model is shown these as "this is what a good bullet
  # looks like here" before it edits anything. They set sentence length, how
  # much context a bullet carries, and how numbers are written. They are the
  # single highest-leverage field in this file.
  #
  # USE YOUR OWN SENTENCES. Leave this empty and the tool falls back to
  # fictional examples (see profile.py), which is safe but weaker — your voice
  # is the point. Never paste someone else's bullets: their numbers leak into
  # your output.
  #
  # The shape that works: verb -> What -> Why (the problem) -> How (the hard
  # part you solved) -> Impact (a measured number). 210-250 characters is normal.
  style_examples:
    - >-
      Migrated billing from a monthly to a weekly cycle for 12,000 merchants,
      after churn interviews showed payout speed drove attrition, by modelling the
      working-capital impact and rebuilding settlement to carry corrections,
      cutting merchant churn 18%
    - >-
      Launched a self-service returns flow after support logs showed 60% of
      tickets were one of three questions, coordinating support, logistics and two
      engineering teams to ship in a single quarter, removing 4,000 tickets a month
